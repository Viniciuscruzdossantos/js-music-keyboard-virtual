<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piano Simulator</title>

  <!-- styles -->
  <link rel="stylesheet" href="./src/styles/reset.css">
  <link rel="stylesheet" href="./src/styles/main.css">

  <!-- fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,400;0,500;0,700;1,100;1,200;1,300;1,400&display=swap"
    rel="stylesheet">
</head>

<body>
  <div class="container">
    <header>
      <h2>Virtual Piano</h2>
      <div class="column volume-slider">
        <span>Volume</span> <input type="range" min="0" max="1" value="0.5" step="any" aria-label="Volume">
      </div>
      <div class="column keys-check">
        <span>Teclas</span> <input type="checkbox" checked aria-label="Mostrar teclas do teclado">
      </div>
      <div class="column notes-check">
        <span>Notas</span> <input type="checkbox" checked aria-label="Mostrar nomes das notas">
      </div>
    </header>

    <ul class="piano-keys">
      <li class="key white" data-key="a"><span>a</span><em></em></li>
      <li class="key black" data-key="w"><span>w</span><em></em></li>
      <li class="key white" data-key="s"><span>s</span><em></em></li>
      <li class="key black" data-key="e"><span>e</span><em></em></li>
      <li class="key white" data-key="d"><span>d</span><em></em></li>
      <li class="key white" data-key="f"><span>f</span><em></em></li>
      <li class="key black" data-key="t"><span>t</span><em></em></li>
      <li class="key white" data-key="g"><span>g</span><em></em></li>
      <li class="key black" data-key="y"><span>y</span><em></em></li>
      <li class="key white" data-key="h"><span>h</span><em></em></li>
      <li class="key black" data-key="u"><span>u</span><em></em></li>
      <li class="key white" data-key="j"><span>j</span><em></em></li>
      <li class="key white" data-key="k"><span>k</span><em></em></li>
      <li class="key black" data-key="o"><span>o</span><em></em></li>
      <li class="key white" data-key="l"><span>l</span><em></em></li>
      <li class="key black" data-key="p"><span>p</span><em></em></li>
      <li class="key white" data-key=";"><span>;</span><em></em></li>
    </ul>

    <section class="controls" aria-label="Gravação e aulas">
      <div class="group">
        <button id="btn-rec" type="button">● Gravar</button>
        <button id="btn-play" type="button" disabled>▶ Tocar</button>
        <button id="btn-clear" type="button" disabled>Limpar</button>
      </div>
      <div class="group">
        <select id="song" aria-label="Escolha uma música"></select>
        <button id="btn-listen" type="button">Ouvir</button>
        <button id="btn-learn" type="button">Aprender</button>
      </div>
    </section>
    <p id="status" role="status" aria-live="polite">Toque no teclado do computador ou clique nas teclas. 🎹</p>
  </div>

  <script src="./src/scripts/engine.js" defer></script>
</body>

</html>
